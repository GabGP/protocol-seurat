# ==============================================================================
# Seurat/1 Configuration (seurat.conf)
# Asynchronous gigapixel image server configuration for LAN and offline grading.
# ==============================================================================

# TCP port for HTTP static assets (SPA in client/dist/) and WebSocket connections (/seurat/v1/lienzo-ws).
# Protocol default is 8080.
http.port=8180

# Watched folder for automatic intake. Drop raw images (PNG, JPEG, TIFF) or .zip archives here
# for background multi-stratum pyramidal processing.
inbox=.seurat/runtime/inbox

# Persistent storage directory holding processed multi-scale pyramid works, brush packages,
# and seed binaries (semilla.bin).
works=.seurat/runtime/obras

# Directory storing persistent token-bucket coverage and fine-detail quota tracking per principal.
coverage=.seurat/runtime/cobertura

# Secret administrative token required in the 'X-Admin-Token' HTTP header for REST endpoints
# (e.g., PUT/DELETE /seurat/v1/obras/{id}, PUT /seurat/v1/obras/{id}/politica).
admin.token=cambia-esto

# Viewer accounts (spec 3.1: POST /seurat/v1/sesion authenticates with "Authorization: Bearer <key>").
# Comma-separated name:key:role, role = autenticado | privilegiado. Without a key a viewer is anonymous.
# Default ceilings per work (PUT /seurat/v1/obras/{id}/politica changes them, persisted in meta.json):
#   anonimo      stratum 1 with 2 bands (half resolution)   brush budget at stratum 1
#   autenticado  stratum 0 with 2 bands (full resolution)   brush budget at stratum 0
#   privilegiado stratum 0 with 4 bands (full quality)      no brush budget
# Sign in from the viewer's settings panel with the key. Change these keys before deploying.
auth.accounts=profesor:profesor-b3ea2c064d95:privilegiado,invitado:invitado-4953ad576b07:autenticado

# Server-wide brush ceiling (BIENVENIDA / CONCESION). Each session is granted min(this, 3 x mem_mib) brushes,
# where the browser declares mem_mib = min(256, deviceMemory x 64), or 128 without deviceMemory; so the grant
# is at most 768 and differs per browser. The viewer then picks its own cap below the grant in Settings > Max brushes.
# Size ladder (root-2 steps; each brush = 256 KiB of VRAM + up to 48 KiB of compressed bands):
#   181  (~45 MiB VRAM +  8.5 MiB bands) - 720p viewport
#   362  (~91 MiB VRAM + 17 MiB bands)   - 1080p viewport, the viewer default
#   512  (128 MiB VRAM + 24 MiB bands)   - 1440p viewport
#   1024 (256 MiB VRAM + 48 MiB bands)   - 4K viewport, unrestricted ceiling (the grant still caps it at 3 x mem_mib)
# Viewports are CSS pixels: a 4K screen at 200 % scaling needs the 1080p cap. Lower this to cap every viewer.
session.max_brushes=1024

# Global egress bandwidth cap across all connected clients combined, in bytes/second.
# 25000000 B/s = 25 MB/s (~200 Mbps). Managed by the rate regulator in paint/Painter.java.
rate.bytes_per_s=25000000

# Console logging verbosity level. Options: TRACE, DEBUG, INFO, WARN, ERROR.
log.level=INFO
